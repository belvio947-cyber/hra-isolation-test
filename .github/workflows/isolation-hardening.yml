name: Isolation Hardening Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            apparmor-profiles \
            apparmor-utils \
            debootstrap \
            iproute2 \
            util-linux \
            coreutils \
            grep \
            mawk \
            python3-seccomp

          echo "===== SECCOMP BPF GENERATION ====="

          /usr/bin/python3 - <<'SECCOMP'
          import os
          import seccomp

          path = os.path.join(os.environ["RUNNER_TEMP"], "deny-ptrace.bpf")

          filt = seccomp.SyscallFilter(
              defaction=seccomp.ALLOW
          )
          filt.add_rule(seccomp.ERRNO(99), "ptrace")

          with open(path, "wb") as output:
              filt.export_bpf(output)

          size = os.path.getsize(path)
          assert size > 0, "Empty BPF filter"

          print("SECCOMP_BPF_GENERATED", size)
          SECCOMP

          test -s "$RUNNER_TEMP/deny-ptrace.bpf"

      - name: Configure restricted Bubblewrap AppArmor profile
        run: |
          set -euo pipefail

          PROFILE_SRC="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          PROFILE_DST="/etc/apparmor.d/bwrap-userns-restrict"

          echo "===== APPARMOR CONFIGURATION ====="
          sysctl kernel.apparmor_restrict_unprivileged_userns

          if [[ ! -r "$PROFILE_SRC" ]]; then
            echo "FAIL: restricted Bubblewrap AppArmor profile not found"
            find /usr/share/apparmor -iname '*bwrap*' -print || true
            exit 1
          fi

          sudo install -m 0644 "$PROFILE_SRC" "$PROFILE_DST"
          sudo apparmor_parser -r "$PROFILE_DST"

          echo "===== VERIFY APPARMOR PROFILE ====="
          sudo aa-status

          echo "===== VERIFY NETWORK NAMESPACE ====="
          bwrap --unshare-user --unshare-net \
            --ro-bind / / --proc /proc --dev /dev \
            /bin/true

          echo "PASS: Bubblewrap network namespace initialized"

      - name: Build minimal filesystem
        run: |
          set -euo pipefail

          ROOTFS="$RUNNER_TEMP/minimal-rootfs"

          sudo debootstrap \
            --variant=minbase \
            --include=bash,python3,iproute2,util-linux,coreutils,grep,mawk \
            noble \
            "$ROOTFS" \
            https://archive.ubuntu.com/ubuntu

          sudo mkdir -p \
            "$ROOTFS/work" \
            "$ROOTFS/tmp" \
            "$ROOTFS/run"


          test -x "$ROOTFS/bin/bash"
          test -x "$ROOTFS/usr/bin/python3"
          test -x "$ROOTFS/usr/bin/unshare"
          test -x "$ROOTFS/usr/sbin/ip" || test -x "$ROOTFS/sbin/ip"

          echo "PASS: minimal filesystem created"
          if ! du -sh "$ROOTFS" 2>"$RUNNER_TEMP/du-errors.log"; then
            echo "WARNING: Some protected directories could not be inspected."
            cat "$RUNNER_TEMP/du-errors.log"
          fi

      - name: Run hardened sandbox tests
        run: |
          set -euo pipefail

          ROOTFS="$RUNNER_TEMP/minimal-rootfs"
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/sandbox-test.sh"
          FILTER="$RUNNER_TEMP/deny-ptrace.bpf"

          echo "===== PRE-FLIGHT CHECKS ====="
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Root filesystem: $ROOTFS"
          echo "Seccomp filter: $FILTER"
          echo "Sandbox script: $SCRIPT"

          if [[ ! -s "$FILTER" ]]; then
            echo "FAIL: seccomp filter missing or empty"
            ls -la "$RUNNER_TEMP"
            exit 1
          fi

          if [[ ! -s "$SCRIPT" ]]; then
            echo "FAIL: sandbox-test.sh missing or empty"
            ls -la "$GITHUB_WORKSPACE/.github/scripts/" || true
            exit 1
          fi

          if [[ ! -x "$ROOTFS/bin/bash" ]]; then
            echo "FAIL: rootfs bash missing"
            exit 1
          fi

          echo "PASS: all required files exist"

          bash -n "$SCRIPT"

          HOST_USER_NS="$(readlink /proc/self/ns/user)"
          HOST_PID_NS="$(readlink /proc/self/ns/pid)"
          HOST_NET_NS="$(readlink /proc/self/ns/net)"
          HOST_MNT_NS="$(readlink /proc/self/ns/mnt)"

          HOST_MARKER="/tmp/hra-host-marker-$$"
          HOST_PROCESS_MARKER="HRA_HOST_SENTINEL_$$"

          touch "$HOST_MARKER"

          bash -c 'exec -a "$1" sleep 300' _ "$HOST_PROCESS_MARKER" &
          HOST_PID=$!

          cleanup() {
            kill "$HOST_PID" 2>/dev/null || true
            rm -f "$HOST_MARKER"
          }

          trap cleanup EXIT

          exec 9< "$FILTER"

          setpriv --no-new-privs timeout 60s bwrap \
            --seccomp 9 \
            --unshare-user \
            --disable-userns \
            --unshare-pid \
            --unshare-net \
            --unshare-ipc \
            --unshare-uts \
            --new-session \
            --die-with-parent \
            --ro-bind "$ROOTFS" / \
            --ro-bind "$SCRIPT" /sandbox-test.sh \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --tmpfs /run \
            --tmpfs /work \
            --cap-drop ALL \
            --clearenv \
            --setenv PATH /usr/bin:/bin:/usr/sbin:/sbin \
            --setenv HOME /tmp \
            --setenv HOST_PROCESS_MARKER "$HOST_PROCESS_MARKER" \
            --setenv HOST_MARKER "$HOST_MARKER" \
            --setenv HOST_USER_NS "$HOST_USER_NS" \
            --setenv HOST_PID_NS "$HOST_PID_NS" \
            --setenv HOST_NET_NS "$HOST_NET_NS" \
            --setenv HOST_MNT_NS "$HOST_MNT_NS" \
            --chdir /work \
            -- \
            /bin/bash --noprofile --norc /sandbox-test.sh

          echo "===== HARDENING DIAGNOSTIC COMPLETED ====="
